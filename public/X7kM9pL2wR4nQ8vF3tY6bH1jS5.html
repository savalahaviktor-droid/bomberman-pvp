<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bomberman PvP - Адмінка</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0d1117;
  font-family: 'Courier New', monospace;
  color: #eee;
  padding: 20px;
}
.hidden { display: none !important; }

.container {
  max-width: 1400px;
  margin: 0 auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #23d3c5;
  padding-bottom: 10px;
  margin-bottom: 20px;
}
.header h1 { color: #23d3c5; margin: 0; }
.header span { color: #93a1b0; font-size: 14px; }

.stats-bar {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.stat-box {
  background: #161d29;
  border: 1px solid #2c3a4d;
  border-radius: 8px;
  padding: 12px 20px;
  min-width: 120px;
}
.stat-box .label { color: #93a1b0; font-size: 11px; text-transform: uppercase; }
.stat-box .value { font-size: 24px; font-weight: bold; color: #7fdcd1; }

.actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}
.actions-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.actions button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  background: #23d3c5;
  color: #0d1117;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: 0.15s;
}
.actions button:hover { background: #37e9db; transform: translateY(-1px); }
.actions button.danger { background: #e04b3b; color: #fff; }
.actions button.danger:hover { background: #ff5a4a; }
.actions button.warning { background: #e0b23b; color: #0d1117; }
.actions button.warning:hover { background: #f0c84b; }
.actions button.success { background: #4ce06a; color: #0d1117; }
.actions button.success:hover { background: #5cf07a; }
.actions button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.actions .label-small { color: #93a1b0; font-size: 12px; margin-right: 4px; }

select {
  padding: 8px 12px;
  border-radius: 6px;
  border: 2px solid #2c3a4d;
  background: #0d1117;
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}
select:focus { outline: none; border-color: #23d3c5; }

.search-box {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}
.search-box input {
  flex: 1;
  padding: 8px 12px;
  border-radius: 6px;
  border: 2px solid #2c3a4d;
  background: #0d1117;
  color: #fff;
  font-size: 13px;
  font-family: inherit;
}
.search-box input:focus { outline: none; border-color: #23d3c5; }
.search-box input::placeholder { color: #555; }

.player-table {
  background: #161d29;
  border: 1px solid #2c3a4d;
  border-radius: 8px;
  overflow: hidden;
  max-height: 500px;
  overflow-y: auto;
}
.player-table table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.player-table th {
  background: #1c2531;
  color: #93a1b0;
  font-size: 11px;
  text-transform: uppercase;
  padding: 10px 12px;
  text-align: left;
  position: sticky;
  top: 0;
  z-index: 10;
}
.player-table td {
  padding: 8px 12px;
  border-bottom: 1px solid #1c2531;
}
.player-table tr:hover td { background: #1c2531; }
.player-table .online { color: #4ce06a; }
.player-table .offline { color: #93a1b0; }
.player-table .banned { color: #e04b3b; font-weight: bold; }
.player-table .rank-badge { width: 26px; height: 18px; object-fit: contain; vertical-align: middle; }
.player-table .btn-sm {
  padding: 4px 12px;
  border: none;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  font-weight: bold;
}
.player-table .btn-ban { background: #e04b3b; color: #fff; }
.player-table .btn-ban:hover { background: #ff5a4a; }
.player-table .btn-unban { background: #4ce06a; color: #0d1117; }
.player-table .btn-unban:hover { background: #5cf07a; }
.player-table .btn-kick { background: #e0b23b; color: #0d1117; }
.player-table .btn-kick:hover { background: #f0c84b; }
.player-table .btn-delete { background: #ff6b6b; color: #fff; }
.player-table .btn-delete:hover { background: #ff8a8a; }
.player-table .btn-ban:disabled, .player-table .btn-kick:disabled { opacity: 0.5; cursor: not-allowed; }
.last-seen { font-size: 11px; color: #93a1b0; }
.ip-addr { font-size: 11px; color: #7fdcd1; }

#loginForm {
  max-width: 400px;
  margin: 100px auto;
  background: #161d29;
  border: 3px solid #23d3c5;
  border-radius: 10px;
  padding: 30px;
  text-align: center;
}
#loginForm input {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: 2px solid #2c3a4d;
  background: #0d1117;
  color: #fff;
  font-size: 15px;
  font-family: inherit;
  margin-bottom: 12px;
}
#loginForm input:focus { outline: none; border-color: #23d3c5; }
#loginForm button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 6px;
  background: #23d3c5;
  color: #0d1117;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  font-family: inherit;
}
#loginForm button:hover { background: #37e9db; }
#loginError { color: #e04b3b; margin-top: 10px; }

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #161d29;
  border: 2px solid #23d3c5;
  border-radius: 8px;
  padding: 15px 25px;
  max-width: 400px;
  z-index: 1000;
  animation: slideIn 0.3s ease;
}
.toast.error { border-color: #e04b3b; }
.toast.success { border-color: #4ce06a; }
.toast.warning { border-color: #e0b23b; }

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

.modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}
.modal-content {
  background: #161d29;
  border: 2px solid #23d3c5;
  border-radius: 10px;
  padding: 30px;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-content h2 { margin-top: 0; color: #23d3c5; }
.modal-content .close { float: right; background: none; border: none; color: #93a1b0; font-size: 24px; cursor: pointer; }
.modal-content .close:hover { color: #fff; }
.modal-content button { margin-top: 10px; }

.backup-list {
  margin: 10px 0;
}
.backup-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 4px;
  border-bottom: 1px solid #1c2531;
}
.backup-item .backup-info {
  display: flex;
  flex-direction: column;
  font-size: 12px;
}
.backup-item .backup-info .backup-name {
  color: #93a1b0;
  font-size: 10px;
}
.backup-item .backup-actions {
  display: flex;
  gap: 6px;
}
.backup-item button {
  padding: 4px 12px;
  border: none;
  border-radius: 4px;
  background: #23d3c5;
  color: #0d1117;
  cursor: pointer;
  font-family: inherit;
  font-weight: bold;
  font-size: 12px;
}
.backup-item button:hover { background: #37e9db; }
.backup-item button.danger {
  background: #e04b3b;
  color: #fff;
}
.backup-item button.danger:hover { background: #ff5a4a; }

.loading {
  text-align: center;
  padding: 40px;
  color: #93a1b0;
}
</style>
</head>
<body>

<div id="loginForm">
  <h1 style="color:#23d3c5;">🔐 Адмін-панель</h1>
  <p style="color:#93a1b0; font-size:13px;">Введіть пароль адміністратора</p>
  <input type="password" id="adminPass" placeholder="Пароль адміна" />
  <button id="adminLoginBtn">УВІЙТИ</button>
  <div id="loginError"></div>
</div>

<div id="adminPanel" class="hidden container">
  <div class="header">
    <h1>🔧 Адмін-панель</h1>
    <span id="serverStatus">🟢 Сервер працює</span>
  </div>

  <div class="stats-bar">
    <div class="stat-box"><div class="label">Всього гравців</div><div class="value" id="totalPlayers">0</div></div>
    <div class="stat-box"><div class="label">Онлайн</div><div class="value" id="onlinePlayers">0</div></div>
    <div class="stat-box"><div class="label">Забанено</div><div class="value" id="bannedCount">0</div></div>
    <div class="stat-box"><div class="label">Статус</div><div class="value" id="restartStatus" style="font-size:16px;">✅</div></div>
  </div>

  <div class="actions">
    <div class="actions-row">
      <span class="label-small">🔄 Перезавантажити через:</span>
      <select id="restartTimeSelect">
        <option value="60">1 хв</option>
        <option value="120">2 хв</option>
        <option value="300">5 хв</option>
        <option value="600">10 хв</option>
        <option value="900">15 хв</option>
        <option value="1800">30 хв</option>
        <option value="3600">60 хв</option>
      </select>
      <button onclick="restartServer(parseInt(document.getElementById('restartTimeSelect').value))">Запустити</button>
      <button onclick="restartServer(10)" class="warning">⚡ 10с</button>
      <button onclick="cancelRestart()" class="danger" id="cancelRestartBtn" disabled>❌ Скасувати</button>
    </div>
    <div class="actions-row">
      <button onclick="wipeData()" class="danger">🧹 Wipe</button>
      <button onclick="createBackup()" class="success">💾 Бекап</button>
      <button onclick="showBackups()" class="warning">📂 Бекапи</button>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Пошук по ніку або IP..." oninput="filterPlayers()" />
  </div>

  <div class="player-table">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Звання</th>
          <th>Нік</th>
          <th>IP</th>
          <th>Вбивств</th>
          <th>Смертей</th>
          <th>Останній вхід</th>
          <th>Статус</th>
          <th>Бан</th>
          <th>Кік</th>
          <th>Видалити</th>
        </tr>
      </thead>
      <tbody id="playersBody">
        <tr><td colspan="11" class="loading">Завантаження...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="backupModal" class="modal hidden">
  <div class="modal-content">
    <button class="close" onclick="closeModal('backupModal')">&times;</button>
    <h2>📂 Бекапи</h2>
    <div id="backupList" class="backup-list">
      <div class="loading">Завантаження...</div>
    </div>
    <button onclick="closeModal('backupModal')" class="back-btn" style="width:100%;padding:10px;border:2px solid #2c3a4d;border-radius:6px;background:transparent;color:#93a1b0;font-family:inherit;cursor:pointer;margin-top:10px;">ЗАКРИТИ</button>
  </div>
</div>

<script>
let ws = null;
let isAdmin = false;
let playersData = [];

function connectAdmin() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  
  ws.onopen = () => {
    const password = document.getElementById('adminPass').value;
    ws.send(JSON.stringify({ type: 'admin_auth', password }));
  };
  
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      
      if (msg.type === 'admin_auth_ok') {
        isAdmin = true;
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        return;
      }
      
      if (msg.type === 'admin_auth_error') {
        document.getElementById('loginError').textContent = msg.message;
        return;
      }
      
      if (msg.type === 'admin_players') {
        playersData = msg.players || [];
        renderPlayers(playersData);
        updateStats(msg);
        return;
      }
      
      if (msg.type === 'admin_restart') {
        if (msg.message) {
          showToast(msg.message, 'warning');
          document.getElementById('restartStatus').textContent = '🔄 Перезавантаження...';
          document.getElementById('cancelRestartBtn').disabled = false;
        } else {
          document.getElementById('restartStatus').textContent = '✅';
          document.getElementById('cancelRestartBtn').disabled = true;
        }
        return;
      }
      
      if (msg.type === 'admin_ban_notify' || msg.type === 'admin_unban_notify' || msg.type === 'admin_kick_notify' || msg.type === 'admin_delete_notify') {
        showToast(msg.message, 'warning');
        requestPlayers();
        return;
      }
      
      if (msg.type === 'admin_wipe') {
        if (msg.message) {
          showToast(msg.message, 'warning');
          requestPlayers();
        }
        return;
      }
      
      if (msg.type === 'admin_backup_done') {
        showToast(`✅ Бекап створено: ${msg.file}`, 'success');
        requestPlayers();
        return;
      }
      
      if (msg.type === 'admin_backup_list') {
        renderBackups(msg.backups);
        return;
      }
      
      if (msg.type === 'admin_restore_done') {
        showToast(msg.message, 'success');
        closeModal('backupModal');
        requestPlayers();
        return;
      }
      
      if (msg.type === 'admin_backup_deleted') {
        showToast(`🗑️ Бекап "${msg.file}" видалено`, 'warning');
        // Оновлюємо список бекапів
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'admin_get_backups' }));
        }
        requestPlayers();
        return;
      }
      
      if (msg.type === 'admin_error') {
        showToast('❌ ' + msg.message, 'error');
        return;
      }
      
      if (msg.type === 'admin_banned' || msg.type === 'admin_kicked') {
        showToast(msg.message, 'error');
        setTimeout(() => { window.location.href = '/'; }, 2000);
        return;
      }
    } catch (e) {
      console.error('Error:', e);
    }
  };
  
  ws.onclose = () => {
    if (isAdmin) {
      showToast('⚠️ З\'єднання втрачено. Перезавантажте сторінку.', 'error');
    }
  };
}

document.getElementById('adminLoginBtn').addEventListener('click', connectAdmin);
document.getElementById('adminPass').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') connectAdmin();
});

function requestPlayers() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_get_players' }));
  }
}

function updateStats(data) {
  document.getElementById('totalPlayers').textContent = data.totalPlayers || 0;
  document.getElementById('onlinePlayers').textContent = data.onlinePlayers || 0;
  document.getElementById('bannedCount').textContent = data.bannedCount || 0;
  
  if (data.isRestarting) {
    document.getElementById('restartStatus').textContent = `🔄 ${data.restartCountdown}с`;
    document.getElementById('cancelRestartBtn').disabled = false;
  } else {
    document.getElementById('restartStatus').textContent = '✅';
    document.getElementById('cancelRestartBtn').disabled = true;
  }
}

function formatDate(dateStr) {
  if (!dateStr || dateStr === 'Ніколи') return 'Ніколи';
  try {
    const d = new Date(dateStr);
    return d.toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch {
    return dateStr;
  }
}

function renderPlayers(players) {
  const tbody = document.getElementById('playersBody');
  if (!players || players.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:#93a1b0;padding:20px;">Немає гравців</td></tr>';
    return;
  }
  
  tbody.innerHTML = players.map((p, i) => `
    <tr data-username="${escapeHtml(p.username)}" data-ip="${escapeHtml(p.ip || '')}">
      <td>${i + 1}</td>
      <td><img class="rank-badge" src="ranks/rank_${p.rankNum}.png" alt="" onerror="this.style.visibility='hidden'" /></td>
      <td><strong>${escapeHtml(p.username)}</strong></td>
      <td class="ip-addr">${escapeHtml(p.ip || 'unknown')}</td>
      <td>${p.kills}</td>
      <td>${p.deaths}</td>
      <td class="last-seen">${formatDate(p.lastSeen)}</td>
      <td>
        ${p.isOnline ? '<span class="online">🟢 Онлайн</span>' : '<span class="offline">⚫ Офлайн</span>'}
        ${p.isBanned ? '<span class="banned"> 🚫</span>' : ''}
      </td>
      <td>
        ${p.isBanned 
          ? `<button class="btn-sm btn-unban" onclick="unbanPlayer('${p.username}')">Розбан</button>`
          : `<button class="btn-sm btn-ban" onclick="banPlayer('${p.username}')">Забанити</button>`
        }
      </td>
      <td>
        <button class="btn-sm btn-kick" onclick="kickPlayer('${p.username}')" ${p.isOnline ? '' : 'disabled'}>👢 Кікнути</button>
      </td>
      <td>
        <button class="btn-sm btn-delete" onclick="deletePlayer('${p.username}')">🗑️</button>
      </td>
    </tr>
  `).join('');
}

function filterPlayers() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const rows = document.querySelectorAll('#playersBody tr');
  rows.forEach(row => {
    const username = (row.dataset.username || '').toLowerCase();
    const ip = (row.dataset.ip || '').toLowerCase();
    const match = username.includes(search) || ip.includes(search);
    row.style.display = match ? '' : 'none';
  });
}

function banPlayer(username) {
  if (!confirm(`Забанити гравця "${username}"?`)) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_ban', username }));
  }
}

function unbanPlayer(username) {
  if (!confirm(`Розбанити гравця "${username}"?`)) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_unban', username }));
  }
}

function kickPlayer(username) {
  if (!confirm(`Вигнати гравця "${username}" з сервера?`)) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_kick', username }));
  }
}

function deletePlayer(username) {
  if (!confirm(`🗑️ ВИ ВПЕВНЕНІ? Видалення гравця "${username}" НЕЗВОРОТНЄ!`)) return;
  if (!confirm(`Ще раз: ВИДАЛИТИ гравця "${username}" назавжди?`)) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_delete', username }));
  }
}

function restartServer(seconds) {
  if (!confirm(`Перезавантажити сервер через ${seconds} секунд?`)) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_restart', seconds }));
  }
}

function cancelRestart() {
  if (!confirm('Скасувати перезавантаження?')) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_cancel_restart' }));
  }
}

function wipeData() {
  if (!confirm('🧹 ВИ ВПЕВНЕНІ? Це видалить ВСІ дані гравців! (бекап буде створено)')) return;
  if (!confirm('Ще раз: ВСІ дані будуть видалені! Продовжити?')) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_wipe' }));
  }
}

function createBackup() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_backup' }));
  }
}

function showBackups() {
  document.getElementById('backupModal').classList.remove('hidden');
  document.getElementById('backupList').innerHTML = '<div class="loading">Завантаження...</div>';
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_get_backups' }));
  }
}

function renderBackups(backups) {
  const list = document.getElementById('backupList');
  if (!backups || backups.length === 0) {
    list.innerHTML = '<div style="color:#93a1b0;padding:20px;text-align:center;">Немає бекапів</div>';
    return;
  }
  list.innerHTML = backups.map(b => `
    <div class="backup-item">
      <div class="backup-info">
        <span>${b.time}</span>
        <span class="backup-name">${b.name}</span>
      </div>
      <div class="backup-actions">
        <button onclick="restoreBackup('${b.name}')">Відновити</button>
        <button class="danger" onclick="deleteBackup('${b.name}')">🗑️</button>
      </div>
    </div>
  `).join('');
}

function restoreBackup(file) {
  if (!confirm(`Відновити дані з бекапу "${file}"? Поточні дані будуть замінені!`)) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_restore_backup', file }));
  }
}

function deleteBackup(file) {
  if (!confirm(`🗑️ Ви впевнені, що хочете видалити бекап "${file}"?`)) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'admin_delete_backup', file }));
  }
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

function showToast(message, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 5000);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

setInterval(requestPlayers, 5000);
</script>
